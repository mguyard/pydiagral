name: Ruff Linter

# Configuration lives in pyproject.toml, so the same commands reproduce this
# job locally:
#   ruff check .
#   ruff format --check .

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, beta, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    # Pinned, and kept in sync with the dev extra in pyproject.toml: a new ruff
    # release must not be able to turn a green PR red on its own.
    - name: Install ruff
      run: pip install ruff==0.17.2

    - name: Ruff check
      run: ruff check --output-format=github .

    - name: Ruff format
      run: ruff format --check --diff .
