name: Lint

# Configuration lives in pyproject.toml, so the same commands reproduce these
# jobs locally:
#   ruff check .
#   ruff format --check .
#   mypy

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev, beta, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    # The version pinned in the dev extra is the only source of truth, so that
    # a Dependabot bump of pyproject.toml also moves CI.
    - name: Install ruff
      run: |
        RUFF=$(python -c 'import tomllib; print(next(d for d in tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"] if d.startswith("ruff")))')
        echo "Installing $RUFF"
        pip install "$RUFF"

    - name: Ruff check
      run: ruff check --output-format=github .

    - name: Ruff format
      run: ruff format --check --diff .

  mypy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    # Editable, so mypy checks src/ against aiohttp's own type hints, with the
    # mypy version pinned in the dev extra.
    - name: Install pydiagral with the dev extra
      env:
        PYPROJECT_VERSION: 0.1.0-dev
      run: pip install -e ".[dev]"

    - name: Mypy
      run: mypy
