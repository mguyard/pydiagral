name: Generate Release and publish to PyPI + Doc Generation

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:
    inputs:
      release:
        description: Tag or ref to build the docs from, e.g. v1.6.1 (defaults to the branch)
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment:
      name: Semver
    # Job-level, as PyPI recommends: id-token lets the PyPI Trusted Publisher
    # verify this workflow, so no long-lived upload token is stored. Pushes and
    # GitHub releases use GH_TOKEN, not GITHUB_TOKEN.
    permissions:
      contents: read
      id-token: write
    outputs:
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatchling

      # main, beta and dev require signed commits, and the release commit flows
      # back to dev. The key's public half is on the maintainer's account, so
      # the committer e-mail must be one of its verified addresses.
      - name: Import GPG key for signed release commits
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/release/package-lock.json

      # Pinned in .github/release so Dependabot proposes each upgrade; release.config.cjs
      # relies on the changelog writer's API
      - name: Install semantic-release
        run: npm ci --prefix .github/release

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: mguyard@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: mguyard@users.noreply.github.com
          DEBUG: semantic-release:*
        run: .github/release/node_modules/.bin/semantic-release

      # semantic-release tags the release commit it creates, so HEAD carries a
      # version tag only when this run published one.
      - name: Read the published version
        id: semantic
        run: |
          tag=$(git tag --points-at HEAD --list 'v*' | head -n 1)
          if [ -n "$tag" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "Published ${tag#v}"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "No release published"
          fi

      - name: Build package
        if: steps.semantic.outputs.new_release_published == 'true'
        run: python -m hatchling build
        env:
          PYPROJECT_VERSION: ${{ steps.semantic.outputs.new_release_version }}

      - name: Publish to PyPI
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  check-doc-changes:
    runs-on: ubuntu-latest
    outputs:
      doc_changed: ${{ steps.filter.outputs.doc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for doc changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            doc:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'overrides/**'

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [release, check-doc-changes]
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.release.outputs.new_release_published == 'true' ||
      needs.check-doc-changes.outputs.doc_changed == 'true'
    # mike commits the built version to gh-pages.
    permissions:
      contents: write
    # A main and a beta release close together would both push to gh-pages.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.release || github.ref }}
          # Tags name the version; gh-pages holds the other channel's docs.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Resolve the docs version and channel
        run: |
          if [ "${{ needs.release.outputs.new_release_published }}" == "true" ]; then
            VERSION="${{ needs.release.outputs.new_release_version }}"
          else
            # The branch's own latest tag: the releases API skips prereleases.
            VERSION=$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')
          fi
          case "${{ github.ref_name }}" in
            main) CHANNEL=stable ;;
            beta) CHANNEL=beta ;;
            *) echo "Docs are published from main or beta only"; exit 1 ;;
          esac
          echo "PYPROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DOCS_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs mkdocstrings[python] mkdocs-material mike
          pip install -e .

      - name: Build documentation
        run: mkdocs build --strict

      # Only this channel's directory changes: the other channel and the
      # redirects for the old paths stay on gh-pages.
      - name: Deploy to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          mike deploy --push --title "$PYPROJECT_VERSION ($DOCS_CHANNEL)" "$DOCS_CHANNEL"
